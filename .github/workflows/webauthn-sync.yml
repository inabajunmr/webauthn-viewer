name: Sync WebAuthn Level 4

on:
  schedule:
    - cron: "23 9 * * MON"
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      publish:
        description: Open a pull request if the published spec has changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: webauthn-spec-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
      commit: ${{ steps.pr.outputs.commit }}
      auto_merge: ${{ steps.spec.outputs.auto_merge }}
      check_pages_build: ${{ steps.spec.outputs.suggestions_changed }}
      scheduled_check: ${{ steps.schedule.outputs.run }}
    steps:
      - name: Check the schedule
        id: schedule
        env:
          EVENT: ${{ github.event_name }}
        run: |
          day=$(TZ=Asia/Tokyo date +%-d)
          if [[ "$EVENT" == workflow_dispatch || "$day" -le 7 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.schedule.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.schedule.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.schedule.outputs.run == 'true'
        run: npm ci
      - name: Compare the W3C publication
        if: steps.schedule.outputs.run == 'true'
        id: spec
        run: |
          node scripts/webauthn-spec.mjs > "$RUNNER_TEMP/webauthn-spec.md"
          cat "$RUNNER_TEMP/webauthn-spec.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the Pages files
        if: steps.spec.outputs.suggestions_changed == 'true'
        run: npm run build
      - name: Open the update PR
        id: pr
        if: steps.spec.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SPEC_DIGEST: ${{ steps.spec.outputs.digest }}
          AUTO_MERGE: ${{ steps.spec.outputs.auto_merge }}
        run: bash scripts/open-webauthn-spec-pr.sh

  check:
    needs: sync
    if: needs.sync.outputs.commit != ''
    uses: ./.github/workflows/webauthn-ci.yml
    with:
      commit: ${{ needs.sync.outputs.commit }}
      check_pages_build: ${{ needs.sync.outputs.check_pages_build == 'true' }}

  merge:
    needs: [sync, check]
    if: needs.sync.outputs.auto_merge == 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ needs.sync.outputs.number }}
      HEAD_COMMIT: ${{ needs.sync.outputs.commit }}
    steps:
      - name: Squash-merge the tested PR
        run: |
          current_base=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_BRANCH" --jq '.commit.sha')
          if [[ "$current_base" != "$GITHUB_SHA" ]]; then
            echo "::error::The base branch changed during testing. Review the PR against the current base."
            exit 1
          fi
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          base=$(gh api "$pr" --jq '.base.ref')
          if [[ "$base" != "$BASE_BRANCH" ]]; then
            echo "::error::The PR target branch changed during testing."
            exit 1
          fi
          merged=$(gh api --method PUT "$pr/merge" -f sha="$HEAD_COMMIT" -f merge_method=squash --jq .merged)
          [[ "$merged" == true ]]

  pages:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

  keep-schedule-active:
    needs: sync
    if: always() && github.event_name == 'schedule' && needs.sync.outputs.scheduled_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Refresh the scheduled workflow before GitHub's inactivity timeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/webauthn-sync.yml/enable" --silent
