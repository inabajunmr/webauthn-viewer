name: Propose WebAuthn implementation with Codex

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      number:
        type: string
        required: true
    secrets:
      openai_api_key:
        required: false
    outputs:
      commit:
        description: Commit containing the Codex proposal
        value: ${{ jobs.publish.outputs.commit }}

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.patch.outputs.artifact }}
    steps:
      - name: Check whether Codex is configured
        id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Set OPENAI_API_KEY to add a Codex proposal to the specification draft." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Prepare dependencies and the W3C reference
        if: steps.credentials.outputs.ready == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/webauthn-spec.mjs --codex-reference > "$RUNNER_TEMP/webauthn-reference.txt"
          cp .github/codex/prompts/webauthn-spec.md "$RUNNER_TEMP/webauthn-prompt.md"
          printf '\nRead the publication reference at `%s/webauthn-reference.txt`. Use targeted searches by term or section anchor.\n' "$RUNNER_TEMP" >> "$RUNNER_TEMP/webauthn-prompt.md"
      - name: Run Codex
        if: steps.credentials.outputs.ready == 'true'
        uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          prompt-file: ${{ runner.temp }}/webauthn-prompt.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bots: true
          codex-version: "0.171.0"
          codex-args: '["--ephemeral"]'
      # Only export the patch here. The publishing runner does not run generated code.
      - name: Export the implementation patch
        id: patch
        if: steps.credentials.outputs.ready == 'true'
        env:
          DRAFT_COMMIT: ${{ inputs.commit }}
        run: |
          git add -A -- src tests docs
          git diff --cached --quiet "$DRAFT_COMMIT" -- src/webauthnSpecSuggestions.js
          if git diff --cached --quiet "$DRAFT_COMMIT" -- src tests; then
            echo "Codex did not propose an implementation patch. See the Codex step for details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --binary --no-renames --no-ext-diff --no-textconv "$DRAFT_COMMIT" -- src tests docs > "$RUNNER_TEMP/webauthn-codex.patch"
          echo "artifact=webauthn-codex-patch-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.patch.outputs.artifact != ''
        with:
          name: ${{ steps.patch.outputs.artifact }}
          path: ${{ runner.temp }}/webauthn-codex.patch
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: propose
    if: needs.propose.outputs.artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.propose.outputs.artifact }}
          path: ${{ runner.temp }}/webauthn-proposal
      - name: Apply the patch to the draft PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_COMMIT: ${{ inputs.commit }}
          PR_NUMBER: ${{ inputs.number }}
        run: bash scripts/publish-webauthn-codex-patch.sh "$RUNNER_TEMP/webauthn-proposal/webauthn-codex.patch"
