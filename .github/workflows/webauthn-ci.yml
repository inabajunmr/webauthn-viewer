name: WebAuthn CI

on:
  pull_request:
    paths-ignore:
      - spec/webauthn-4.json
      - src/webauthnSpecSuggestions.js
      - docs/**
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      check_pages_build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spec-and-chromium:
    name: Spec and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:spec
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: inputs.check_pages_build
        run: diff -qr docs .playwright-build
